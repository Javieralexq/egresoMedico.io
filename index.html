<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Pacientes</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 25px;
        }

        .form-grid.full {
            grid-template-columns: 1fr;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #444;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        input[type="tel"],
        select,
        textarea {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="date"]:focus,
        input[type="tel"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
        }

        button {
            padding: 14px 35px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-reset {
            background: #f5f5f5;
            color: #666;
        }

        .btn-reset:hover {
            background: #e8e8e8;
        }

        .success-message {
            display: none;
            background: #4caf50;
            color: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 25px;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Formulario de Ingreso de Pacientes</h1>

        <div class="success-message" id="successMessage">
            ✓ Formulario enviado correctamente
        </div>

        <form id="patientForm">
            <!-- Información Básica -->
            <div class="form-section">
                <h2 class="section-title">Información Básica</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="numero">Nº</label>
                        <input type="number" id="numero" name="numero" placeholder="Ej: 001">
                    </div>
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" required>
                    </div>
                    <div class="form-group">
                        <label for="edad">Edad</label>
                        <input type="text" id="edad" name="edad" placeholder="Ej: 5 años 3 meses 15 días">
                    </div>
                    <div class="form-group">
                        <label for="dni">DNI</label>
                        <input type="text" id="dni" name="dni" placeholder="Ej: 12345678">
                    </div>
                </div>
            </div>

            <!-- Información Clínica -->
            <div class="form-section">
                <h2 class="section-title">Información Clínica</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="hcl">HCL (Historia Clínica)</label>
                        <input type="text" id="hcl" name="hcl" placeholder="Nº de historia clínica">
                    </div>
                    <div class="form-group">
                        <label for="hb">HB (Hemoglobina)</label>
                        <input type="number" id="hb" name="hb" step="0.1" placeholder="Ej: 14.5 g/dL">
                    </div>
                    <div class="form-group">
                        <label for="fi">FI (Fecha de Inicio)</label>
                        <input type="date" id="fi" name="fi">
                    </div>
                    <div class="form-group">
                        <label for="alta">ALTA</label>
                        <input type="date" id="alta" name="alta">
                    </div>
                    <div class="form-group">
                        <label for="telemonitoreo">Telemonitoreo</label>
                        <input type="date" id="telemonitoreo" name="telemonitoreo">
                    </div>
                </div>
            </div>

            <!-- Diagnósticos -->
            <div class="form-section">
                <h2 class="section-title">Diagnósticos</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="dx1">DX 1 (Diagnóstico Principal)</label>
                        <input type="text" id="dx1" name="dx1" placeholder="Seleccionar o agregar..." list="dx-list">
                    </div>
                    <div class="form-group">
                        <label for="dx2">DX 2 (Diagnóstico Secundario)</label>
                        <input type="text" id="dx2" name="dx2" placeholder="Seleccionar o agregar..." list="dx-list">
                    </div>
                    <div class="form-group">
                        <label for="dx3">DX 3 (Diagnóstico Terciario)</label>
                        <input type="text" id="dx3" name="dx3" placeholder="Seleccionar o agregar..." list="dx-list">
                    </div>
                </div>
                <datalist id="dx-list">
                    <option value="SEPSIS"></option>
                    <option value="RINOFARINGITIS EDA"></option>
                    <option value="Otitis Media"></option>
                    <option value="Chalazión"></option>
                    <option value="ITU"></option>
                    <option value="Urticaria"></option>
                    <option value="CARBAMATOŠ Edema"></option>
                    <option value="ICTERICIA"></option>
                    <option value="Crisis Asmática EDA"></option>
                    <option value="Otalgía"></option>
                    <option value="Conjuntivitis"></option>
                    <option value="Pielonefritis"></option>
                    <option value="Picadura de Insecto"></option>
                    <option value="ALCALIS"></option>
                    <option value="Disuria"></option>
                    <option value="EDA"></option>
                    <option value="Amigdalitis"></option>
                    <option value="EDA Disentérica"></option>
                    <option value="Gingivoestomatitis"></option>
                    <option value="Cataratas congénitas"></option>
                    <option value="Hematuria"></option>
                    <option value="Absceso"></option>
                    <option value="BENZODIACEÍ Tuberculosis pulmonar"></option>
                    <option value="SALAM"></option>
                    <option value="SOB"></option>
                    <option value="Ascariasis"></option>
                    <option value="Sd. Febril"></option>
                    <option value="Candidiasis"></option>
                    <option value="DESCONOCIDA Adenopatía"></option>
                    <option value="SINDROME EN Neumonía"></option>
                    <option value="Deshidratación severa"></option>
                    <option value="Adenitis"></option>
                    <option value="Alcohol"></option>
                    <option value="Dengue sin signos"></option>
                    <option value="HIPOGLICEMIA Bronquiolitis"></option>
                    <option value="Estreñimiento"></option>
                    <option value="Celulitis"></option>
                    <option value="Pesticidas"></option>
                    <option value="Cardiopatía congénita"></option>
                    <option value="BRONQUIOLITI Crup"></option>
                    <option value="Sd. Doloroso Abdominal"></option>
                    <option value="Angioedema"></option>
                    <option value="Cuerpo extraño"></option>
                    <option value="SDR"></option>
                    <option value="Sd Coqueluch Pancreatitis aguda"></option>
                    <option value="DERMATITIS"></option>
                    <option value="Fiebre persistente"></option>
                    <option value="SINDROME FE Bronquitis Aguda"></option>
                    <option value="Apendiciitis"></option>
                    <option value="Acarosis"></option>
                    <option value="Hipoglicemia"></option>
                    <option value="SIND. COQUE Faringitis Aguda"></option>
                    <option value="Hepatitis viral"></option>
                    <option value="Impétigo"></option>
                    <option value="Intoxicación Aguda"></option>
                    <option value="CÓLICO DE G Herpangina"></option>
                    <option value="Sepsis"></option>
                    <option value="EXANTEMA"></option>
                    <option value="Dolor torácico"></option>
                    <option value="CARDIOPATÍA QMA"></option>
                    <option value="Síndrome Emético"></option>
                    <option value="Frenillo"></option>
                    <option value="R. NACIDO SA Derrame pleural"></option>
                    <option value="Intolerancia Oral"></option>
                    <option value="PIV"></option>
                    <option value="FX DE CLAVÍC TBC"></option>
                    <option value="Asfixia"></option>
                    <option value="PARTO DOMI Enf Memb Hialina"></option>
                    <option value="CONJUNTIVITI Insuficiencia Respiratoria Aguda"></option>
                </datalist>
            </div>

            <!-- Ubicación y Contacto -->
            <div class="form-section">
                <h2 class="section-title">Ubicación y Contacto</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="distrito">Distrito</label>
                        <input type="text" id="distrito" name="distrito" placeholder="Seleccionar o agregar..." list="distritos-list">
                        <datalist id="distritos-list">
                            <option value="El Agustino"></option>
                            <option value="Santa Anita"></option>
                            <option value="SJL"></option>
                            <option value="Ate"></option>
                            <option value="Provincia"></option>
                            <option value="Lima Cercado"></option>
                            <option value="Pachacamac"></option>
                            <option value="La Molina"></option>
                            <option value="La Victoria"></option>
                            <option value="Cieneguilla"></option>
                            <option value="Carabayllo"></option>
                        </datalist>
                    </div>
                    <div class="form-group">
                        <label for="telefono1">Teléfono 1</label>
                        <input type="tel" id="telefono1" name="telefono1" placeholder="Ej: +51 999 999 999">
                    </div>
                    <div class="form-group">
                        <label for="telefono2">Teléfono 2 (Opcional)</label>
                        <input type="tel" id="telefono2" name="telefono2" placeholder="Ej: +51 999 999 999">
                    </div>
                    <div class="form-group full">
                        <label for="direccion">Dirección</label>
                        <textarea id="direccion" name="direccion" placeholder="Dirección completa..."></textarea>
                    </div>
                </div>
            </div>

            <!-- Información Adicional -->
            <div class="form-section">
                <h2 class="section-title">Información Adicional</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="dniMama">DNI Mamá</label>
                        <input type="text" id="dniMama" name="dniMama" placeholder="Ej: 12345678">
                    </div>
                    <div class="form-group full">
                        <label for="pendientes">Pendientes</label>
                        <input type="text" id="pendientes" name="pendientes" placeholder="Ej: seguimiento, pendiente...">
                    </div>
                </div>
            </div>

            <!-- Botones -->
            <div class="button-group">
                <button type="submit" class="btn-submit">💾 Guardar</button>
                <button type="reset" class="btn-reset">🔄 Limpiar</button>
                <button type="button" class="btn-submit" id="downloadBtn" style="background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);">📊 Descargar Excel</button>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('patientForm');
        const successMessage = document.getElementById('successMessage');
        const downloadBtn = document.getElementById('downloadBtn');

        // Carga los registros guardados
        function loadRecords() {
            const records = localStorage.getItem('patientRecords');
            return records ? JSON.parse(records) : [];
        }

        // Guarda los registros
        function saveRecords(records) {
            localStorage.setItem('patientRecords', JSON.stringify(records));
        }

        // Al enviar el formulario
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            // Recopila datos del formulario
            const formData = new FormData(form);
            const data = Object.fromEntries(formData);

            // Agrega timestamp
            data.fecha_registro = new Date().toLocaleString('es-PE');

            // Obtiene registros existentes y agrega el nuevo
            const records = loadRecords();
            records.push(data);
            saveRecords(records);

            console.log('Datos guardados:', data);

            // Muestra mensaje de éxito
            successMessage.style.display = 'block';
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 4000);

            // Limpia el formulario
            form.reset();
        });

        // Descarga en Excel
        downloadBtn.addEventListener('click', function() {
            const records = loadRecords();

            if (records.length === 0) {
                alert('No hay registros para descargar');
                return;
            }

            // Convierte a formato de hoja de cálculo
            const worksheet = XLSX.utils.json_to_sheet(records);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, 'Pacientes');

            // Ajusta el ancho de las columnas
            const columnWidths = [
                { wch: 5 },   // Nº
                { wch: 20 },  // Nombre
                { wch: 15 },  // Edad
                { wch: 15 },  // HCL
                { wch: 15 },  // DNI
                { wch: 12 },  // FI
                { wch: 12 },  // ALTA
                { wch: 12 },  // Telemonitoreo
                { wch: 8 },   // HB
                { wch: 15 },  // Distrito
                { wch: 30 },  // Dirección
                { wch: 15 },  // Teléfono 1
                { wch: 15 },  // Teléfono 2
                { wch: 20 },  // DNI Mamá
                { wch: 20 },  // DX 1
                { wch: 20 },  // DX 2
                { wch: 20 },  // DX 3
                { wch: 12 },  // Pendientes
                { wch: 20 }   // Fecha de registro
            ];
            worksheet['!cols'] = columnWidths;

            // Descarga el archivo
            const fileName = `pacientes_${new Date().toISOString().slice(0, 10)}.xlsx`;
            XLSX.writeFile(workbook, fileName);
        });
    </script>
</body>
</html>
